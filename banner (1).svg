<svg width="1584" height="396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050010"/>
      <stop offset="40%" style="stop-color:#0a0428"/>
      <stop offset="100%" style="stop-color:#000d1a"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="45%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#bf5fff"/>
    </linearGradient>

    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3a00cc;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.7"/>
    </linearGradient>

    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0044bb;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:0.6"/>
    </linearGradient>

    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#001a88;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0088cc;stop-opacity:0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="orbglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7700ff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#7700ff;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#00aaff;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#00ffcc;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>

  <!-- Animated background orbs -->
  <ellipse cx="220" cy="180" rx="220" ry="180" fill="url(#orb1)" filter="url(#orbglow)">
    <animate attributeName="cx" values="220;280;220" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="180;150;180" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="1350" cy="200" rx="250" ry="190" fill="url(#orb2)" filter="url(#orbglow)">
    <animate attributeName="cx" values="1350;1290;1350" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;240;200" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="792" cy="380" rx="400" ry="120" fill="url(#orb3)" filter="url(#orbglow)">
    <animate attributeName="ry" values="120;150;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Grid lines subtle -->
  <g opacity="0.07">
    <line x1="0" y1="99" x2="1584" y2="99" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="0" y1="198" x2="1584" y2="198" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="0" y1="297" x2="1584" y2="297" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="264" y1="0" x2="264" y2="396" stroke="#a855f7" stroke-width="0.8"/>
    <line x1="528" y1="0" x2="528" y2="396" stroke="#a855f7" stroke-width="0.8"/>
    <line x1="792" y1="0" x2="792" y2="396" stroke="#a855f7" stroke-width="0.8"/>
    <line x1="1056" y1="0" x2="1056" y2="396" stroke="#a855f7" stroke-width="0.8"/>
    <line x1="1320" y1="0" x2="1320" y2="396" stroke="#a855f7" stroke-width="0.8"/>
  </g>

  <!-- Floating particles -->
  <g filter="url(#softglow)">
    <!-- Large bright particles -->
    <circle cx="120" cy="60" r="4" fill="#00e5ff">
      <animate attributeName="cy" values="60;20;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.1;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="300" r="3" fill="#bf5fff">
      <animate attributeName="cy" values="300;260;300" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="80" r="4" fill="#ffffff">
      <animate attributeName="cy" values="80;40;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="330" r="3" fill="#00e5ff">
      <animate attributeName="cy" values="330;295;330" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="50" r="4" fill="#bf5fff">
      <animate attributeName="cy" values="50;15;50" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.1;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="280" r="3" fill="#ffffff">
      <animate attributeName="cy" values="280;245;280" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="70" r="4" fill="#00e5ff">
      <animate attributeName="cy" values="70;30;70" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1450" cy="200" r="3" fill="#bf5fff">
      <animate attributeName="cy" values="200;165;200" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Small dim particles -->
    <circle cx="180" cy="200" r="2" fill="#00e5ff">
      <animate attributeName="cy" values="200;170;200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="150" r="2" fill="#bf5fff">
      <animate attributeName="cy" values="150;120;150" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="220" r="2" fill="#ffffff">
      <animate attributeName="cy" values="220;190;220" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="130" r="2" fill="#00e5ff">
      <animate attributeName="cy" values="130;100;130" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1350" cy="320" r="2" fill="#bf5fff">
      <animate attributeName="cy" values="320;290;320" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1520" cy="80" r="2" fill="#ffffff">
      <animate attributeName="cy" values="80;50;80" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pulsing rings left -->
  <circle cx="60" cy="198" r="40" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="20;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="198" r="40" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0">
    <animate attributeName="r" values="20;80" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing rings right -->
  <circle cx="1524" cy="198" r="40" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="20;85" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1524" cy="198" r="40" fill="none" stroke="#a855f7" stroke-width="1" opacity="0">
    <animate attributeName="r" values="20;85" dur="4.5s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="4.5s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- NAME shadow -->
  <text x="796" y="152" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="96" font-weight="900"
        fill="#000033" opacity="0.6">GOKUL V</text>

  <!-- NAME glowing -->
  <text x="792" y="148" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="96" font-weight="900"
        fill="url(#nameGrad)" filter="url(#glow)">
    GOKUL V
    <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Animated underline -->
  <rect x="792" y="160" width="0" height="3" rx="1.5" fill="url(#nameGrad)">
    <animate attributeName="width" values="0;700" dur="1.2s" fill="freeze"/>
    <animate attributeName="x" values="792;442" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- Role text -->
  <text x="792" y="208" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600"
        fill="#88bbee" letter-spacing="2" opacity="0.95">
    AI &amp; Data Science  ·  Full Stack Developer  ·  Competitive Programming
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- GitHub handle -->
  <text x="792" y="310" text-anchor="middle"
        font-family="monospace" font-size="15"
        fill="#556688" letter-spacing="3">
    ✦  github.com/kit2824bad047-source  ✦
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Animated waves at bottom -->
  <path fill="url(#wave1Grad)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,330 C264,300 528,360 792,330 C1056,300 1320,360 1584,330 L1584,396 L0,396 Z;
        M0,345 C264,368 528,315 792,345 C1056,368 1320,315 1584,345 L1584,396 L0,396 Z;
        M0,330 C264,300 528,360 792,330 C1056,300 1320,360 1584,330 L1584,396 L0,396 Z
      "/>
  </path>
  <path fill="url(#wave2Grad)">
    <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
      values="
        M0,352 C330,330 660,374 990,352 C1210,338 1400,368 1584,352 L1584,396 L0,396 Z;
        M0,364 C330,378 660,342 990,364 C1210,375 1400,348 1584,364 L1584,396 L0,396 Z;
        M0,352 C330,330 660,374 990,352 C1210,338 1400,368 1584,352 L1584,396 L0,396 Z
      "/>
  </path>
  <path fill="url(#wave3Grad)">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="
        M0,372 C396,358 792,386 1188,372 C1386,365 1500,380 1584,372 L1584,396 L0,396 Z;
        M0,380 C396,388 792,364 1188,380 C1386,385 1500,370 1584,380 L1584,396 L0,396 Z;
        M0,372 C396,358 792,386 1188,372 C1386,365 1500,380 1584,372 L1584,396 L0,396 Z
      "/>
  </path>

</svg>
